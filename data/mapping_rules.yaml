# 2. REGLAS DE DESGLOSE (SPLIT: 1 Materia -> Varias nuevas)
# -----------------------------------------------------------------
- type: SPLIT_1toN
  src_2018_codes: ["OC"]
  dst_2025_codes: ["OC1", "OC2"]
  comment: "Organización de Computadoras se desglosa en OC1 y OC2 en el plan 2025."

- type: SPLIT_1toN
  src_2018_codes: ["767"]
  dst_2025_codes: ["789", "792"]
  comment: "Introducción a la Programación (767) cubre los contenidos de 789 y 792."

# 3. REGLAS DE FUSIÓN (MERGE: Varias -> 1 Materia + Créditos ACA)
# -----------------------------------------------------------------
- type: MERGE_Nto1
  src_2018_codes: ["PF", "PC"]
  dst_2025_codes: ["LI4"]
  aca_on_partial: 3
  comment: "Para LI4 se requiere PF y PC. Si falta una, el sistema otorga 3 créditos ACA."

- type: MERGE_Nto1
  src_2018_codes: ["761", "776", "780"]
  dst_2025_codes: ["LI2"]
  aca_on_partial: 3
  aca_partial_mode: per_source
  comment: "Fusión para LI2: Otorga 3 ACA por cada materia (Funcional, Objetos III o Lenguajes) aprobada."

